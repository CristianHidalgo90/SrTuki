name: Actualizar videos recientes de YouTube
on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/actualizar_youtube.py
      - .github/workflows/youtube.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: actualizar-youtube
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/actualizar_youtube.py
      - name: Publicar lista actualizada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- datos/youtube.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/youtube.json
          git commit -m "Actualizar videos públicos recientes de YouTube"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
